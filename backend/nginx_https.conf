# ============================================================
# 老年拍照助手 —— Nginx HTTPS 上线配置(域名已填:guangyingliuhen.xyz)
# 适用:阿里云服务器 60.205.13.93(宝塔或原生 nginx 均可)
# 前置:1) DNS A 记录已指向 60.205.13.93(见 部署说明.md §七)
#       2) 域名 ICP 备案通过,已申请 SSL 证书
#       3) 证书放到:
#            /etc/nginx/ssl/guangyingliuhen.xyz.pem
#            /etc/nginx/ssl/guangyingliuhen.xyz.key
# 步骤:保存为 /etc/nginx/conf.d/elder-photo.conf(先备份旧的)
#       nginx -t && systemctl reload nginx
# 注意:后端 FastAPI 仍监听 127.0.0.1:8000,由本配置反向代理;
#       图片/语音直链 /uploads/ 由 nginx 直接吐,不经过 Python。
# ============================================================

# ---- HTTP → HTTPS 跳转 ----
server {
    listen 80;
    server_name guangyingliuhen.xyz www.guangyingliuhen.xyz;

    # 微信小程序上线只认 HTTPS,80 一律 301 到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS 主站点 ----
server {
    listen 443 ssl http2;
    server_name guangyingliuhen.xyz www.guangyingliuhen.xyz;

    ssl_certificate     /etc/nginx/ssl/guangyingliuhen.xyz.pem;
    ssl_certificate_key /etc/nginx/ssl/guangyingliuhen.xyz.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 25m;   # 上传照片 ≤20MB,语音小文件,留余量

    # 上传的图片/语音直链(小程序 <image> / 语音播放器直接访问)
    location /uploads/ {
        alias /home/elder_photo_project/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # API 反向代理到 FastAPI
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 关键:让后端拼出的图片/语音直链使用 https
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
