# ============================================================
# 老年拍照助手 —— Nginx HTTPS 配置(Let's Encrypt / certbot 版)
# 域名:guangyingliuhen.cn    服务器:60.205.13.93
#
# 前置条件(缺一不可):
#   1) DNS A 记录 guangyingliuhen.cn / www → 60.205.13.93(解析生效)
#   2) 安全组放行 80/80 与 443/443
#   3) 已执行:certbot certonly --nginx -d guangyingliuhen.cn -d www.guangyingliuhen.cn
#      (证书落在 /etc/letsencrypt/live/guangyingliuhen.cn/)
#
# 安装:
#   cp /home/elder_photo_project/backend/nginx_letsencrypt.conf /etc/nginx/conf.d/elder-photo.conf
#   nginx -t && systemctl reload nginx
#
# 注意:若你已在 /etc/nginx/nginx.conf 里定义过同名 limit_req_zone(见 安全加固清单.md),
#       请删除本文件顶部的 zone 定义,避免 "duplicate zone" 报错。
# ============================================================

# ---- 限流区(HTTP 上下文;AI 是成本入口,登录是爆破入口)----
limit_req_zone $binary_remote_addr zone=ai_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=20r/m;

# ---- HTTP:仅保留 ACME 校验 + 跳转 HTTPS ----
server {
    listen 80;
    server_name guangyingliuhen.cn www.guangyingliuhen.cn;

    # certbot 续期校验路径(务必保留,否则 3 个月后自动续期失败)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS 主站 ----
server {
    listen 443 ssl;
    http2 on;                      # Nginx 1.25+ 写法(旧版 listen ... http2 已弃用)
    server_name guangyingliuhen.cn www.guangyingliuhen.cn;

    # Let's Encrypt 证书(certbot 自动续期,勿手动改路径)
    ssl_certificate     /etc/letsencrypt/live/guangyingliuhen.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guangyingliuhen.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    server_tokens off;                      # 隐藏 Nginx 版本号
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy no-referrer;

    client_max_body_size 25m;               # 上传照片 ≤20MB,留余量

    # 上传的图片/语音/AI 结果直链(小程序 <image> 与音频组件直接访问)
    location /uploads/ {
        alias /home/elder_photo_project/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # AI 修图:单次成本高,按 IP 限流(每分钟 10 次,突发 5)
    location = /api/ai/enhance {
        limit_req zone=ai_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;    # 让后端拼出的直链为 https
        proxy_read_timeout 120s;                        # AI 处理耗时长
        proxy_send_timeout 120s;
    }

    # 登录:防爆破(与后端 utils/ratelimit.py 叠加)
    location = /api/auth/login {
        limit_req zone=login_zone burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余 API
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;    # 关键:图片/语音直链自动为 https
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
